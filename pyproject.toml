[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardify"
version = "1.0.0"
description = "Bilingual cyberbullying detection platform for English and Hinglish text"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Educational Use" }
authors = [{ name = "Hashir Ahmad" }]
dependencies = [
  "fastapi>=0.116.0",
  "joblib>=1.4.2",
  "nltk>=3.9.1",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
  "pydantic>=2.11.3",
  "PyYAML>=6.0.2",
  "scikit-learn>=1.8.0",
  "torch>=2.9.1",
  "transformers>=4.57.3",
  "tqdm>=4.67.1",
  "uvicorn>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

