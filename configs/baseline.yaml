project:
  name: Guardify

datasets:
  - name: hasoc_proxy
    type: hasoc_csv
    path: data/external/hasoc_proxy.csv
    text_column: text
    label_column: task_1

preprocessing:
  lowercase: true
  transliterate: false
  keep_hashtag_text: true

training:
  task: baseline
  test_size: 0.25
  val_size: 0.25
  random_state: 42
  output_name: sample-baseline
  kfold: 3

baseline:
  models:
    - logistic_regression
    - linear_svm
  ngram_range: [1, 2]
  min_df: 1
  max_features: 3000

artifacts:
  root: artifacts

